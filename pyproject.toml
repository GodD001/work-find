[project]
name = "job-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "jinja2==3.1.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
